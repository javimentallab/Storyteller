name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: ffmpeg, for the tests that convert audio
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: What the engine's text handling needs
        run: pip install -r engine/deps/base/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests
